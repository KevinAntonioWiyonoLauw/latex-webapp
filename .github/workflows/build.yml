# Build & publish image LaTeX Web Editor ke GitHub Container Registry.
#
# Alur:
#   * push ke main   -> :latest, :main, :sha-<short>
#   * tag vX.Y.Z     -> :X.Y.Z, :X.Y, :latest, :sha-<short>
#   * pull request   -> build saja (tidak push), sebagai gate
#   * manual         -> workflow_dispatch
#
# Tiga image dipublikasikan:
#   ghcr.io/<owner>/latex-webapp-server   (Fastify + Tectonic + pandoc)
#   ghcr.io/<owner>/latex-webapp-collab   (Hocuspocus / Yjs, Node)
#   ghcr.io/<owner>/latex-webapp-web      (SPA statis di nginx)
#
# Image ini yang ditarik homelab lewat Portainer.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cegah dua build berjalan bersamaan: tanpa ini, dua push berurutan bisa
# membuat build lama (yang selesai belakangan) menimpa tag `:latest` hasil
# build baru. Build lama yang masih jalan dibatalkan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Gate: typecheck + build harus lolos sebelum image dipublikasikan.
  # ---------------------------------------------------------------------------
  verify:
    name: typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  # ---------------------------------------------------------------------------
  # Publish: satu job per image, matriks agar tidak mengulang konfigurasi.
  # ---------------------------------------------------------------------------
  publish:
    name: publish ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            target: server
          - name: collab
            target: collab
          - name: web
            target: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.name == 'web' && 'docker/web.Dockerfile' || 'docker/server.Dockerfile' }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true
