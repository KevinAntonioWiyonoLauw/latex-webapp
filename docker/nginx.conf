# Konfigurasi nginx untuk SPA LaTeX Web Editor.
# File ini di-COPY ke /etc/nginx/conf.d/default.conf (dimuat di dalam blok `http`).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html JANGAN di-cache: file ini yang menunjuk ke hash bundle
    # terbaru. Bila di-cache, browser memakai index.html lama → menunjuk
    # bundle/worker lama yang sudah tidak ada → preview PDF gagal
    # ("Failed to fetch dynamically imported module").
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # Worker PDF.js (.mjs) — WAJIB diberi MIME JavaScript.
    #
    # nginx bawaan hanya memetakan `.js`, bukan `.mjs`. Vite mem-build worker
    # PDF.js sebagai `pdf.worker.min-<hash>.mjs`; tanpa aturan ini file dikirim
    # sebagai `application/octet-stream`, browser MENOLAK module worker, dan
    # preview PDF tampil kosong tanpa pesan error apa pun.
    #
    # `default_type` dipakai karena lebih andal daripada menambah entri ke
    # mime.types (blok `types` di konteks server akan MENGGANTIKAN, bukan
    # menggabungkan, pemetaan dari level http).
    location ~* \.mjs$ {
        default_type text/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # KOMPATIBILITAS worker PDF.js ber-hash LAMA.
    #
    # Sebelum build ini, worker diberi nama `pdf.worker.min-<hash>.mjs` yang
    # berubah tiap build. Tab browser yang masih terbuka memegang bundle lama
    # dan meminta hash LAMA yang sudah tidak ada → preview PDF gagal dengan
    # "Failed to fetch dynamically imported module".
    #
    # Blok ini membuat nama lama APA PUN tetap dilayani dengan mengarahkannya
    # ke file stabil `pdf.worker.min.mjs`. Jadi user yang tab-nya belum
    # di-refresh tetap bisa melihat preview, tanpa perlu hard-refresh.
    location ~* ^/assets/pdf\.worker\.min-[A-Za-z0-9_-]+\.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "no-cache";
        try_files /assets/pdf.worker.min.mjs =404;
    }

    # File statis lain dengan cache panjang
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
