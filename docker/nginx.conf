# Konfigurasi nginx untuk SPA LaTeX Web Editor.
# File ini di-COPY ke /etc/nginx/conf.d/default.conf (dimuat di dalam blok `http`).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Worker PDF.js (.mjs) — WAJIB diberi MIME JavaScript.
    #
    # nginx bawaan hanya memetakan `.js`, bukan `.mjs`. Vite mem-build worker
    # PDF.js sebagai `pdf.worker.min-<hash>.mjs`; tanpa aturan ini file dikirim
    # sebagai `application/octet-stream`, browser MENOLAK module worker, dan
    # preview PDF tampil kosong tanpa pesan error apa pun.
    #
    # `default_type` dipakai karena lebih andal daripada menambah entri ke
    # mime.types (blok `types` di konteks server akan MENGGANTIKAN, bukan
    # menggabungkan, pemetaan dari level http).
    location ~* \.mjs$ {
        default_type text/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # File statis lain dengan cache panjang
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
